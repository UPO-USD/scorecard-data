  FREQ_COLL: Anual académico
  REL_CAL_POLICY: julio
  area_action: >-
    <ul>
      <li>Educación y sensibilización para reducir los desperdicios alimentarios, a través de campañas de concienciación, carteles informativos, charlas y talleres.</li>
      <li>Planificación y gestión de la oferta alimentaria para reducir los desperdicios. Esto puede incluir ofrecer porciones más pequeñas, opciones vegetarianas y veganas, y opciones para llevar para aquellos que no puedan terminar su comida en el comedor.</li>
      <li>Compostaje para reducir significativamente los desperdicios alimentarios. Los restos de comida pueden ser compostados y utilizados para fertilizar el suelo en los jardines del campus.</li>
      <li>Donaciones de alimentos: En lugar de tirar la comida sobrante, se puede donar a organizaciones benéficas locales. Esto no solo reduce los desperdicios, sino que también ayuda a las personas necesitadas.</li>
      <li>Referencia: FAO. 2022. Código de conducta voluntario para la reducción de las pérdidas y el desperdicio de alimentos. Roma. https://doi.org/10.4060/cb9433es</li>
