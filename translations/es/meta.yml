  SOURCE_TYPE: >-
    Actualmente no disponible pero se considera un indicador estratégico para el Plan de Acción próximo, que incluirá los medios necesarios para medirlo (Registros de proveedores de servicios alimentarios, Encuestas a comunidad universitaria, Herramienta calculadora de desperdicio alimentario)
