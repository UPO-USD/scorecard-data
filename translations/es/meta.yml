    Para el denominado se contabilizará el personal PDI a tiempo completo, tanto personal funcionario como contratado.
  OTHER_DOC: >-
    <b><a style="text-decoration: underline;" href="https://upo-usd.github.io/scorecard-site/assets/docs/Ficha_Indicadores_UPO_ODS_4_vDEF.docx" target="_blank">Información detallada</a></b>
